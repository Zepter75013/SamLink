services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samlink-backend
    restart: always
    env_file: .env
    environment:
      APP_PORT: 8080
    ports:
      - "8095:8080"
    volumes:
      - ./chat-files:/app/uploads/chat

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: samlink-frontend
    restart: always
    ports:
      - "8096:80"
    depends_on:
      - backend
